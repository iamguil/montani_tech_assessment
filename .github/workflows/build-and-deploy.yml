name: Build and Deploy to S3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build application
      run: |
        go build -o hello-world main.go
    
    - name: Create timestamped archive
      run: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        ARCHIVE_NAME="hello-world-${TIMESTAMP}.tar.gz"
        tar -czf ${ARCHIVE_NAME} hello-world
        echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
        echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Upload to S3
      run: |
        aws s3 cp ${ARCHIVE_NAME} s3://${{ secrets.S3_BUCKET_NAME }}/${ARCHIVE_NAME}
        echo "Uploaded ${ARCHIVE_NAME} to S3"
    
    - name: Upload artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: hello-world-${{ env.TIMESTAMP }}
        path: ${{ env.ARCHIVE_NAME }}
        retention-days: 30
